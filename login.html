<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion - NocturnaTV</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
    max-width:500px;
    margin:auto;
    padding-top:80px;
}

h1{
    color:red;
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    background:#222;
    color:white;
    border:none;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    background:red;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#cc0000;
}

.retour{
    display:block;
    text-align:center;
    margin-top:20px;
    color:white;
    text-decoration:none;
}

</style>

</head>

<body>

<h1>👤 Connexion NocturnaTV</h1>

<input
id="email"
type="email"
placeholder="Adresse email">

<input
id="password"
type="password"
placeholder="Mot de passe">

<button onclick="inscription()">
Créer un compte
</button>

<button onclick="connexion()">
Se connecter
</button>

<a href="index.html" class="retour">
← Retour à l'accueil
</a>

<script>

const SUPABASE_URL =
"https://ueiyahynvavqgnewqqjp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_lF3VPe_BGfTNLDm-qe70fg_ZGQNA6jJ";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function inscription(){

    const email =
    document.getElementById(
        "email"
    ).value;

    const password =
    document.getElementById(
        "password"
    ).value;

    const { error } =
    await supabaseClient.auth.signUp({
        email,
        password
    });

    if(error){

        alert(error.message);

    }else{

        alert(
        "Compte créé avec succès"
        );

    }
}

async function connexion(){

    const email =
    document.getElementById(
        "email"
    ).value;

    const password =
    document.getElementById(
        "password"
    ).value;

    const { error } =
    await supabaseClient.auth.signInWithPassword({
        email,
        password
    });

    if(error){

        alert(error.message);

    }else{

        alert(
        "Connexion réussie"
        );

        window.location =
        "index.html";
    }
}

</script>

</body>
</html>
