<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NocturnaTV - Vidéos</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    margin:0;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    text-align:center;
    background:#150000;
    padding:20px;
    border-bottom:2px solid red;
}

h1{
    color:red;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card{
    background:#111;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    border-left:4px solid red;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    background:#222;
    color:white;
    border:none;
}

button{
    background:red;
    color:white;
    border:none;
    padding:10px 20px;
    cursor:pointer;
    border-radius:5px;
}

button:hover{
    background:#cc0000;
}

iframe{
    width:100%;
    height:400px;
    margin-top:10px;
}

.comment{
    background:#1a1a1a;
    padding:8px;
    margin-top:5px;
    border-radius:5px;
}

.retour{
    color:white;
    text-decoration:none;
}

</style>

</head>
<body>

<header>

<h1>🎥 Vidéos d'Horreur</h1>

<p>Partage les vidéos les plus terrifiantes.</p>

<a class="retour" href="index.html">
← Retour à l'accueil
</a>

</header>

<div class="container">

<div class="card">

<h2>Ajouter une vidéo</h2>

<input
id="titre"
placeholder="Titre de la vidéo">

<input
id="youtube"
placeholder="Lien YouTube">

<button onclick="publierVideo()">
Publier
</button>

</div>

<div id="videos"></div>

</div>

<script>

const SUPABASE_URL =
"https://ueiyahynvavqgnewqqjp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_lF3VPe_BGfTNLDm-qe70fg_ZGQNA6jJ";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function afficherVideos(){

    const { data, error } =
    await supabaseClient
        .from("videos")
        .select("*")
        .order("id", { ascending:false });

    if(error){
        console.error(error);
        return;
    }

    let html = "";

    data.forEach(video => {

        html += `
        <div class="card">

            <h2>${video.titre}</h2>

            <iframe
            src="https://www.youtube.com/embed/${video.youtube_id}"
            allowfullscreen>
            </iframe>

            <br><br>

            <button
            onclick="likerVideo(${video.id})">
                ❤️ ${video.likes || 0}
            </button>

            <hr>

            <h3>💬 Commentaires</h3>

            <input
            id="commentaire-${video.id}"
            placeholder="Votre commentaire">

            <button
            onclick="ajouterCommentaire(${video.id})">
                Envoyer
            </button>

            <div id="comments-${video.id}">
            </div>

        </div>
        `;

    });

    document.getElementById("videos").innerHTML =
    html;

    data.forEach(video => {
        chargerCommentaires(video.id);
    });
}

async function publierVideo(){

    const titre =
    document.getElementById("titre").value;

    const lien =
    document.getElementById("youtube").value;

    if(!titre || !lien){

        alert("Complète tous les champs");
        return;
    }

    let youtube_id = "";

    if(lien.includes("watch?v=")){

        youtube_id =
        lien.split("watch?v=")[1]
        .split("&")[0];

    }else{

        alert("Lien YouTube invalide");
        return;
    }

    const { error } =
    await supabaseClient
        .from("videos")
        .insert([
            {
                titre,
                youtube_id,
                likes:0
            }
        ]);

    if(error){

        console.error(error);
        alert("Erreur publication vidéo");
        return;
    }

    afficherVideos();
}

async function likerVideo(id){

    const { data } =
    await supabaseClient
        .from("videos")
        .select("likes")
        .eq("id", id)
        .single();

    const likesActuels =
    data.likes || 0;

    await supabaseClient
        .from("videos")
        .update({
            likes: likesActuels + 1
        })
        .eq("id", id);

    afficherVideos();
}

async function ajouterCommentaire(videoId){

    const {
        data:userData
    } =
    await supabaseClient.auth.getUser();

    const user =
    userData.user;

    if(!user){

        alert(
        "Connecte-toi pour commenter"
        );

        return;
    }

    const { data:profil } =
    await supabaseClient
        .from("profiles")
        .select("pseudo")
        .eq("id", user.id)
        .single();

    const contenu =
    document.getElementById(
        `commentaire-${videoId}`
    ).value;

    if(!contenu){

        alert(
        "Écris un commentaire"
        );

        return;
    }

    const { error } =
    await supabaseClient
        .from("comments")
        .insert([
        {
            video_id: videoId,
            auteur: profil.pseudo,
            contenu
        }
        ]);

    if(error){

        console.error(error);

        alert(
        "Erreur commentaire"
        );

        return;
    }

    afficherVideos();
}

async function chargerCommentaires(videoId){

    const { data, error } =
    await supabaseClient
        .from("comments")
        .select("*")
        .eq("video_id", videoId)
        .order("id", {
            ascending:false
        });

    if(error){
        console.error(error);
        return;
    }

    let html = "";

    data.forEach(comment => {

        html += `
        <div class="comment">
            <strong>${comment.auteur}</strong>
            :
            ${comment.contenu}
        </div>
        `;

    });

    const zone =
    document.getElementById(
        `comments-${videoId}`
    );

    if(zone){
        zone.innerHTML = html;
    }
}

afficherVideos();

</script>

</body>
</html>
