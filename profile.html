<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Profil - NocturnaTV</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
    max-width:700px;
    margin:auto;
    padding:30px;
}

input,
textarea{
    width:100%;
    padding:10px;
    margin:10px 0;
    background:#222;
    color:white;
    border:none;
    border-radius:5px;
}

button{
    background:red;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
}

h1{
    color:red;
}

</style>
</head>

<body>

<h1>👤 Mon Profil</h1>

<input
id="pseudo"
placeholder="Pseudo">

<textarea
id="bio"
placeholder="Parle de toi..."
rows="5"></textarea>

<button onclick="sauvegarderProfil()">
Sauvegarder
</button>

<script>

const SUPABASE_URL =
"https://ueiyahynvavqgnewqqjp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_lF3VPe_BGfTNLDm-qe70fg_ZGQNA6jJ";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function sauvegarderProfil(){

    const {
        data:userData
    } =
    await supabaseClient.auth.getUser();

    const user =
    userData.user;

    if(!user){

        alert("Tu dois être connecté.");

        return;
    }

    const pseudo =
    document.getElementById(
        "pseudo"
    ).value;

    const bio =
    document.getElementById(
        "bio"
    ).value;

    const { error } =
    await supabaseClient
        .from("profiles")
        .upsert([
        {
            id:user.id,
            pseudo,
            bio
        }
        ]);

    if(error){

        alert(error.message);

    }else{

        alert(
        "Profil sauvegardé"
        );

    }
}

</script>

</body>
</html>
